name: Keep the site awake

# Render's free plan puts the service to sleep after about 15 minutes without a request, and the next visitor then
# waits 25 seconds or more for a blank page. This asks for the health page every 10 minutes so that does not happen.
#
# Notes:
#  - GitHub may delay scheduled runs by a few minutes when it is busy; the 10-minute gap leaves room for that.
#  - GitHub switches scheduled workflows off after 60 days without any activity in the repository. If the site
#    starts sleeping again, open the Actions tab and enable this workflow, or push any commit.
#  - /up is Laravel's own health route: it answers 200 without touching the database.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request the health page
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 \
            --output /dev/null --write-out "HTTP %{http_code} in %{time_total}s\n" \
            https://amoec-track-admin.onrender.com/up
